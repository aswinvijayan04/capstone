# A Service gives the pods one stable address and load-balances across them.
apiVersion: v1
kind: Service
metadata:
  name: transaction-validator
  labels:
    app: transaction-validator 
spec:
  type: LoadBalancer                # on EKS this creates an AWS load balancer with a public address
  selector:
    app: transaction-validator      # send traffic to pods with this label
  ports:
    - name: http                    # a named port, so Prometheus can refer to it
      port: 80
      targetPort: 8080           # the port the container listens on